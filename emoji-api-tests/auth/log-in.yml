info:
  name: log-in
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/login"
  body:
    type: json
    data: |
      {
        "username": "{{username}}",
        "password": "{{password}}"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.token
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
