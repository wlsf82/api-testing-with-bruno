info:
  name: category-does-not-exist
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/emojis?category=plants"
  params:
    - name: category
      value: plants
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
