info:
  name: create-an-emoji-that-already-exists
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/emojis"
  body:
    type: json
    data: |-
      {
        "emoji": "🐢",
        "name": "turtle",
        "category": "animals"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
