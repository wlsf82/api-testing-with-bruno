info:
  name: create-with-a-letter-as-the-emoji
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/emojis"
  body:
    type: json
    data: |-
      {
        "emoji": "a",
        "name": "letter a",
        "category": "nature"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test('error message mentions emoji', () => {
          const error = res.getBody().error

          expect(error).include('emoji')
        })
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
