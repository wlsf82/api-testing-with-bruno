info:
  name: create-with-an-unknown-token
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/emojis"
  body:
    type: json
    data: |-
      {
        "emoji": "🦩",
        "name": "flamingo",
        "category": "animals"
      }
  auth:
    type: bearer
    token: not-a-real-token

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
