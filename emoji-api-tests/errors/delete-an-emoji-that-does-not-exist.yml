info:
  name: delete-an-emoji-that-does-not-exist
  type: http
  seq: 11

http:
  method: DELETE
  url: "{{baseUrl}}/emojis/99999"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
