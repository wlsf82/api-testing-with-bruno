info:
  name: page-is-zero
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/emojis?page=0"
  params:
    - name: page
      value: "0"
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
