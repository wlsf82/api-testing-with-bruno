info:
  name: delete-the-unicorn
  type: http
  seq: 2

http:
  method: DELETE
  url: "{{baseUrl}}/emojis/{{firstId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
