info:
  name: create
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/emojis"
  body:
    type: json
    data: |-
      {
        "emoji": "🪐",
        "name": "ringed planet",
        "category": "nature"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("lifecycleId", res.getBody().id)
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
