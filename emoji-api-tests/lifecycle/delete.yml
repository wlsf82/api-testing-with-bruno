info:
  name: delete
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/emojis/{{lifecycleId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
