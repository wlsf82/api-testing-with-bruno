info:
  name: read
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/emojis/{{lifecycleId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.emoji
      operator: eq
      value: 🪐
    - expression: res.body.name
      operator: eq
      value: ringed planet
    - expression: res.body.category
      operator: eq
      value: nature

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
