info:
  name: filter-by-category
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/emojis?category=animals"
  params:
    - name: category
      value: animals
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test('returns only emojis from the animals category', () => {
          const emojis = res.getBody().emojis
          
          emojis.forEach(({ category }) => {
            expect(category).to.eq('animals')
          })
        })
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.emojis
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
