info:
  name: get-emojis
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/emojis?limit={{defaultLimit}}"
  params:
    - name: limit
      value: "{{defaultLimit}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test('pageInfo fields are numbers', () => {
          const body = res.getBody()

          const {
            currentPage,
            limit,
            totalPages,
            totalEmojis
          } = body.pageInfo

          expect(currentPage).to.be.a('number')
          expect(limit).to.be.a('number')
          expect(totalPages).to.be.a('number')
          expect(totalEmojis).to.be.a('number')
        })

        test('emojis prop types are correct', () => {
          const emojis = res.getBody().emojis

          emojis.forEach(({
            id,
            emoji,
            name,
            category
          }) => {
            expect(id).to.be.a('number')
            expect(emoji).to.be.a('string')
            expect(name).to.be.a('string')
            expect(category).to.be.a('string')
          })
        })
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.emojis
      operator: isArray
    - expression: res.body.pageInfo
      operator: isDefined
    - expression: res.body.pageInfo.currentPage
      operator: eq
      value: "1"
    - expression: res.body.emojis
      operator: length
      value: "10"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
