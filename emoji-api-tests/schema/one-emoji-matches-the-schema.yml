info:
  name: one-emoji-matches-the-schema
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/emojis/13"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const tv4 = require("tv4")
        const emojiSchema = bru.getVar("emojiSchema")

        test("the response matches the emoji schema", () => {
          const isValid = tv4.validate(res.getBody(), emojiSchema)
          expect(isValid, JSON.stringify(tv4.error)).to.equal(true)
        })
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
